# Herdr default role profiles.
# All four roles run Pi against the built-in opencode-go provider, set 2026-10-30.
# Herdr defaults are independent after initialization. Availability needs a live check.
# Other harnesses: omp takes model/thinking/approval-mode (effort and mode are
# native tokens); opencode binds an explicit native model/variant session, then
# starts the full TUI with --session and mode = "default" only. See
# references/opencode-launch.md and adapters/herdr.md for the launch contract.
[planner]
harness = "pi"
model = "opencode-go/kimi-k3.1-pro"
effort = "high"
mode = "default"

[implementer]
harness = "pi"
model = "opencode-go/deepseek-v4.1-flash"
effort = "high"
mode = "default"

[reviewer]
harness = "pi"
model = "opencode-go/mimo-v2.6-pro"
effort = "high"
mode = "default"

[qa]
harness = "pi"
model = "opencode-go/deepseek-v4.1-flash"
effort = "high"
mode = "default"
