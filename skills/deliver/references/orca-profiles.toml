# Orca default role profiles. Set 2026-11-26; availability needs a live check.
# A project or run role table replaces the matching default table whole.
# Orca's worker-start has no per-role mode flag, so these tables hold no mode.
# Yolo comes from Orca's agentDefaultArgs: antigravity launches with
# --dangerously-skip-permissions, pi has no permission flag and keeps native
# approvals. See adapters/orca.md.
[planner]
harness = "antigravity"
model = "gemini-4-hydrogen-high"
effort = "high"

[implementer]
harness = "pi"
model = "commandcode/deepseek/deepseek-v4.1-flash"
effort = "high"

[reviewer]
harness = "pi"
model = "opencode/gemini-4-hydrogen"
effort = "high"

[qa]
harness = "antigravity"
model = "gemini-4-hydrogen-medium"
effort = "medium"
