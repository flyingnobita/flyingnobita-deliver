# Herdr default role profiles.
# Planner and QA run agy Gemini 4 Hydrogen (high and medium) with permission
# prompts skipped. Implementer runs Pi with CommandCode DeepSeek Flash; reviewer
# runs Pi with OpenCode Gemini 4 Hydrogen. Pi has no permission-mode flag, so it
# stays on native approvals, set 2026-11-26.
# Herdr defaults are independent after initialization. Availability needs a live check.
# Other harnesses: omp takes model/thinking/approval-mode (effort and mode are
# native tokens); opencode binds an explicit native model/variant session, then
# starts the full TUI with --session and mode = "default" only. See
# references/opencode-launch.md and adapters/herdr.md for the launch contract.
[planner]
harness = "agy"
model = "gemini-4-hydrogen-high"
effort = "high"
mode = "dangerously-skip-permissions"

[implementer]
harness = "pi"
model = "commandcode/deepseek/deepseek-v4.1-flash"
effort = "high"
mode = "default"

[reviewer]
harness = "pi"
model = "opencode/gemini-4-hydrogen"
effort = "high"
mode = "default"

[qa]
harness = "agy"
model = "gemini-4-hydrogen-medium"
effort = "medium"
mode = "dangerously-skip-permissions"
